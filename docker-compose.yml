services:
  # PostgreSQL stores notes, tasks, tags, and semantic-search embeddings.
  postgres:
    image: postgres:15-alpine
    container_name: notes-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: agent_notes_db
    ports:
      - "5433:5432" # Maps port 5433 on your Mac to port 5432 inside the container to avoid local conflicts
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
